name: CI Backend

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    name: Lint and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: alimma_test
          POSTGRES_USER: alimma
          POSTGRES_PASSWORD: alimma_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alimma -d alimma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://alimma:alimma_test_password@127.0.0.1:5432/alimma_test
      SECRET_KEY: ci-test-secret-key
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: alimma_test
      POSTGRES_USER: alimma
      POSTGRES_PASSWORD: alimma_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          pip install flake8 pytest-cov

      - name: Lint with flake8
        run: flake8

      - name: Run tests with coverage
        run: pytest --cov=apps --cov-fail-under=70
