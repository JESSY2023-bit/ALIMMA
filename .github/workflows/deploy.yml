name: Deploy production

on:
  workflow_run:
    workflows: ["CI Backend", "CI Frontend"]
    types: [completed]

# Les hooks de déploiement utilisent des secrets. Ils ne sont exécutés que
# pour une CI réussie provenant de la branche de production.
permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.name == 'CI Backend' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST \
            --url "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.name == 'CI Frontend' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST \
            --url "$VERCEL_DEPLOY_HOOK_URL"
