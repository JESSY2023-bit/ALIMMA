config:
  target: "http://localhost:5000"
  timeout: 10
  http:
    pool: 100
  
  phases:
    # Montée progressive de 100 à 5000 req/s
    - duration: 30
      arrivalRate: 100
      name: "Démarrage"
    - duration: 60
      arrivalRate: 100
      rampTo: 500
      name: "Montée 100→500"
    - duration: 60
      arrivalRate: 500
      rampTo: 1000
      name: "Montée 500→1000"
    - duration: 60
      arrivalRate: 1000
      rampTo: 2000
      name: "Montée 1000→2000"
    - duration: 60
      arrivalRate: 2000
      rampTo: 5000
      name: "🔥 Zone de rupture"

scenarios:
  # UNIQUEMENT le health check (non rate-limited)
  - name: "Health check pur"
    flow:
      - get:
          url: "/api/health"